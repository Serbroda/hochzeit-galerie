{{define "layout"}}<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="{{asset "img/logo.png"}}">
    <link rel="apple-touch-icon" href="{{asset "img/logo.png"}}">
    <link rel="stylesheet" href="{{asset "css/app.css"}}">
    {{- if .Scripts}}
    <script src="{{asset "js/app.js"}}"></script>
    <script src="{{asset "js/alpine.min.js"}}" defer></script>
    {{- end}}
    <title>{{block "title" .}}Fotos – {{.Name1}} &amp; {{.Name2}}{{end}}</title>
</head>
<body class="bg-stone-50 text-stone-800 antialiased overflow-x-hidden">

<main id="content">
    <div class="bg-paper min-h-screen flex flex-col">
        {{template "content" .}}

        <footer class="mt-auto py-8 px-6 bg-white border-t border-stone-200/70">
            <div class="max-w-4xl mx-auto text-center">
                <p class="text-sm text-stone-400">{{.Name1}} &amp; {{.Name2}}</p>
            </div>
        </footer>
    </div>
</main>

</body>
</html>{{end}}

{{define "heading"}}
            <p class="text-sm tracking-[0.3em] uppercase text-stone-400 mb-4">Fotogalerie</p>
            <h1 class="font-serif text-3xl sm:text-4xl font-light text-stone-800 mb-3">
                {{.Name1}} <span class="text-rose-400">&amp;</span> {{.Name2}}
            </h1>
{{end}}
