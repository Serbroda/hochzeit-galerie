{{define "content"}}
    <section class="min-h-[70vh] flex items-center py-16 px-6 bg-gradient-to-b from-rose-50/70 to-transparent">
        <div class="w-full max-w-sm mx-auto text-center">
            {{template "heading" .}}
            <p class="text-stone-500 text-sm mb-8">Die Galerie ist mit einem Passwort geschützt.</p>

            {{if .Error}}
            <div class="mb-4 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">
                <span>{{.Error}}</span>
            </div>
            {{end}}

            <form action="/photos/{{.Token}}/unlock" method="post" class="space-y-4">
                <input type="hidden" name="returnTo" value="{{.ReturnTo}}">
                <input type="password" name="password" placeholder="Passwort" required autofocus
                       autocomplete="current-password"
                       class="w-full rounded-xl border border-stone-200 bg-white p-3 text-sm text-stone-700 text-center focus:border-rose-300 focus:ring-rose-200">
                <button type="submit"
                        class="w-full rounded-full bg-rose-400 py-3 text-sm font-medium text-white
                               shadow-md shadow-rose-200 hover:bg-rose-500 transition-colors cursor-pointer">
                    Zu den Fotos
                </button>
            </form>
        </div>
    </section>
{{end}}
